server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scrapper}
    username: ${DB_USER:scrapper}
    password: ${DB_PASSWORD:scrapper}
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
  application:
    name: scrapper
  config:
    import: optional:file:.env[.properties]

app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HEREq
    base-url: https://api.stackexchange.com/2.3
  github:
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    base-url: https://api.github.com
  access-type: ${ACCESS_TYPE:SQL}
  scheduler:
    interval: 30000
    batch-size: 1000
    thread-count: 4

bot:
  base-url: ${BOT_URL:http://localhost:8081}


