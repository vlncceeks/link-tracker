server:
  port: 8082

spring:
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scrapper}
    username: ${DB_USER:scrapper}
    password: ${DB_PASSWORD:scrapper}
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
  application:
    name: scrapper
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.fasterxml.jackson.databind.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6380
      password: bitnami
  cache:
    type: redis
    redis:
      time-to-live: 10m

app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HEREq
    base-url: https://api.stackexchange.com/2.3
  github:
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    base-url: https://api.github.com
  access-type: ${ACCESS_TYPE:ORM}
  scheduler:
    interval: 30000
    batch-size: 1000
    thread-count: 4
  kafka:
    topic: link-updates
  rate-limit:
    requests-per-second: 10

bot:
  base-url: ${BOT_URL:http://localhost:8081}
  connect-timeout: 3s
  read-timeout: 5s
  retryable-statuses: [429, 500, 502, 503, 504]

resilience4j:
  retry:
    instances:
      botRetry:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - backend.academy.linktracker.scrapper.application.exception.RetryableException
        ignore-exceptions:
          - backend.academy.linktracker.scrapper.application.exception.BotClientException
  circuitbreaker:
    instances:
      botCB:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 1s
        register-health-indicator: true
