server:
  port: 8083

spring:
  application:
    name: ai-agent
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}

app:
  kafka:
    input-topic: raw-updates
    output-topic: processed-updates

  filtering:
    stop-words:
      - spam
      - ads
      - promo
    min-length: 20
    excluded-authors:
      - bot-user

  summarization:
    threshold: 200

  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs

  grouping:
    window-ms: 30000
